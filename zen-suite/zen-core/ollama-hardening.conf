# Watermark: Living_Sin (intricos777-dot) + AI agents (Hermes, Lia, opencode) - collaborative work
# Ollama Hardening Drop-In
# Place at: /etc/systemd/system/ollama.service.d/hardening.conf

[Service]
# Network hardening: bind only to loopback
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_ORIGINS=http://localhost:*"
Environment="OLLAMA_ORIGINS=https://localhost:*"

# Prevent privilege escalation after start
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true

# Filesystem access
ReadOnlyPaths=/
ReadWritePaths=/var/lib/ollama
ReadWritePaths=/var/log/ollama
ReadWritePaths=/tmp
InaccessiblePaths=/home

# Network: only allow loopback
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# Capabilities
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE

# Exec restrictions
ExecReload=/bin/kill -s HUP $MAINPID

[Unit]
# Ensure ollama starts after network is up locally
After=network.target local-fs.target
Wants=network.target

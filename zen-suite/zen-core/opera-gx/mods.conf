# Watermark: Living_Sin (intricos777-dot) + AI agents (Hermes, Lia, opencode) - collaborative work
# OperaGX global mods/config stubs
# Placeholder for OperaGX browser-level overrides
# This file is copied to /etc/opt/opera-gx/mods.conf or equivalent in the ISO
[global]
enable_gx_mods=true
gx_control_panel=enabled
gx_cleaner=disabled
gx_force_gpu_acceleration=true
gx_disable_telemetry=true
gx_disable_crash_reporter=true
gx_block_ads=true
gx_disable_news_feed=true
gx_start_page=about:blank
